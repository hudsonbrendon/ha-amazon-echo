send_text_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    text:
      required: true
      example: "what is the weather tomorrow"
      selector:
        text:

play_sound:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    sound:
      required: true
      example: amzn_sfx_doorbell_chime_01
      selector:
        text:

run_routine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    routine:
      required: true
      example: "Good night"
      selector:
        text:

create_routine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    name:
      required: true
      example: "Modo leitura"
      selector:
        text:
    phrases:
      required: true
      example: '["modo leitura"]'
      selector:
        text:
          multiple: true
    actions:
      required: true
      example: '[{"device": "Lâmpada 1 da sala", "action": "brightness", "value": 40}, {"speak": "Boa leitura"}]'
      selector:
        object:
    enabled:
      default: true
      selector:
        boolean:

update_routine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    routine:
      required: true
      example: "desligar quarto"
      selector:
        text:
    name:
      selector:
        text:
    phrases:
      selector:
        text:
          multiple: true
    actions:
      selector:
        object:
    enabled:
      selector:
        boolean:
    replace_devices:
      example: '{"Lâmpada antiga": "Lâmpada 1 do quarto"}'
      selector:
        object:

delete_routine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    routine:
      required: true
      example: "Teste"
      selector:
        text:

launch_skill:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    skill_id:
      required: true
      example: amzn1.ask.skill.00000000-0000-0000-0000-000000000000
      selector:
        text:

create_alarm:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    time:
      required: true
      example: "2026-12-01 07:00:00"
      selector:
        datetime:
    recurrence:
      example: DAILY
      selector:
        text:
    alarm_type:
      default: default
      selector:
        select:
          translation_key: alarm_type
          options:
            - default
            - music
    music_provider:
      example: TUNEIN
      selector:
        text:
    music_entity:
      example: Jazz Radio
      selector:
        text:

create_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    duration:
      required: true
      example: "00:10:00"
      selector:
        duration:
    label:
      example: Pasta
      selector:
        text:

create_reminder:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    time:
      required: true
      example: "2026-12-01 18:00:00"
      selector:
        datetime:
    label:
      required: true
      example: Take out the trash
      selector:
        text:

delete_notification:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    notification_id:
      required: true
      selector:
        text:

get_notifications:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo

get_voice_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    limit:
      example: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box

bluetooth_connect:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    address:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:

bluetooth_disconnect:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo

call_feature:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    feature:
      required: true
      example: power
      selector:
        text:
    operation:
      required: true
      example: turnOn
      selector:
        text:
    endpoint_id:
      selector:
        text:
    instance:
      selector:
        text:
    payload:
      selector:
        object:

send_info_skill:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    skill:
      required: true
      example: weather
      selector:
        select:
          translation_key: info_skill
          options:
            - calendar_today
            - calendar_tomorrow
            - calendar_next
            - date
            - time
            - national_news
            - flash_briefing
            - traffic
            - weather
            - clean_up
            - good_morning
            - sing_a_song
            - fun_fact
            - joke
            - tell_story
            - im_home
            - good_night

send_mobile_push:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    message:
      required: true
      example: "The washing machine is done"
      selector:
        text:
    title:
      example: Laundry
      selector:
        text:

send_drop_in_notification:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
    message:
      required: true
      example: "The washing machine is done"
      selector:
        text:
    title:
      example: Laundry
      selector:
        text:

send_announcement:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: amazon_echo
          multiple: true
    message:
      required: true
      example: "The washing machine is done"
      selector:
        text:
    title:
      example: Laundry
      selector:
        text:
    method:
      default: all
      selector:
        select:
          translation_key: announcement_method
          options:
            - all
            - speak
            - show

